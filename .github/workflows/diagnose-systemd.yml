name: Diagnose systemd access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, swartzit]
    timeout-minutes: 5
    steps:
      - name: Unprivileged baseline
        run: |
          set +e
          echo "=== namespaces (unprivileged) ==="
          readlink /proc/self/ns/pid
          readlink /proc/1/ns/pid
          cat /proc/self/cgroup
          echo "=== systemctl unprivileged ==="
          systemctl is-system-running 2>&1
          echo "=== systemctl stop dry run is not a thing; check the unit is visible ==="
          systemctl show -p ActiveState swartzit 2>&1
      - name: Same checks as root through the grant
        run: |
          set +e
          sudo -n /var/tmp/diagnose-root.sh
