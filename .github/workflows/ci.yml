name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swartzit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d swartzit"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/swartzit
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: 'cargo test --workspace bookmarks::tests:: -- --ignored'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node scripts/web-runtime-smoke.mjs
      - run: node --test scripts/*.test.mjs
      - run: node --check scripts/import-x-bookmarks.mjs && node --check scripts/prepare-bookmark-transfer.mjs
