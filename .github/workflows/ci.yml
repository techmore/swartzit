name: CI
# Run once per change: on pull requests, and on pushes to main.
# Pushing to a PR branch used to start CI twice (push + pull_request), and every
# techmore repo shares one account-wide concurrent job limit.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:/tmp/swartzit-ci.sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node scripts/web-runtime-smoke.mjs
      - run: node --test scripts/*.test.mjs
      - run: python3 scripts/benchmark/battery.test.py && python3 scripts/benchmark/adapters.test.py && python3 scripts/benchmark/first-gemma-trial.test.py && python3 scripts/export-bookmark-media-manifest.test.py
      - run: bash -n scripts/benchmark/install-gemma-litert.sh
      - run: node --check scripts/import-x-bookmarks.mjs && node --check scripts/prepare-bookmark-transfer.mjs
