name: Deploy production

on:
  # Tag-triggered rather than every push to main. Each production deploy is a
  # published, checksummed release artifact, so a merge to main cannot change a
  # live host by itself. This pairs with release.yml, which builds the assets
  # this workflow installs.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v0.1.36-20260925T19'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swartzit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Keep the workflow present and reviewable before production secrets are
    # configured. Set the repository variable to true to opt the live host in.
    if: ${{ vars.SWARTZIT_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.SWARTZIT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SWARTZIT_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.SWARTZIT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SWARTZIT_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo 'Missing SWARTZIT_DEPLOY_HOST' >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'Missing SWARTZIT_DEPLOY_USER' >&2; exit 1; }
          test -n "$DEPLOY_KEY" || { echo 'Missing SWARTZIT_DEPLOY_SSH_KEY' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing SWARTZIT_DEPLOY_KNOWN_HOSTS' >&2; exit 1; }

      - name: Install deployment SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.SWARTZIT_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SWARTZIT_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Update production from this release
        env:
          DEPLOY_HOST: ${{ secrets.SWARTZIT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SWARTZIT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SWARTZIT_DEPLOY_PORT }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "Refusing to deploy unexpected tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          # The remote updater verifies the published release checksums, backs
          # up PostgreSQL, rehearses the candidate release against a restored
          # copy, and rolls back if the health gate fails.
          ssh -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /var/lib/swartzit/scripts/swartzit-linux-update.sh --tag $RELEASE_TAG --yes"

      - name: Collect production update receipt
        if: ${{ failure() }}
        env:
          DEPLOY_HOST: ${{ secrets.SWARTZIT_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SWARTZIT_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SWARTZIT_DEPLOY_PORT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n cat /var/lib/swartzit/state/update-receipt.json' \
            2>/dev/null || echo 'No production update receipt was available.'
