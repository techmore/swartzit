name: Deploy production

on:
  # Tag-triggered rather than every push to main. Each production deploy is a
  # published, checksummed release artifact, so a merge to main cannot change a
  # live host by itself. This pairs with release.yml, which builds the assets
  # this workflow installs.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy a release or sync only the production X token'
        required: true
        type: choice
        options:
          - deploy
          - sync-x-token
          - test-x-token
        default: deploy
      tag:
        description: 'Release tag (used only when operation is deploy)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: swartzit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Keep the workflow present and reviewable before the deploy is enabled.
    # Set the repository variable to true to opt the live host in.
    if: ${{ vars.SWARTZIT_DEPLOY_ENABLED == 'true' }}
    # This host is not reachable from a GitHub-hosted runner: the public address
    # is CGNAT and only 80/443 are forwarded, so an SSH-based deploy from GitHub
    # can never connect. The runner therefore lives on the host itself and the
    # deploy is a single local command with no keys, no known_hosts, and no
    # inbound port.
    runs-on: [self-hosted, swartzit, production]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resolve the release tag
        id: tag
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        env:
          REQUESTED: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            v[0-9]*) ;;
            *)
              echo "Refusing to deploy unexpected tag: $REQUESTED" >&2
              exit 1
              ;;
          esac
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Require an approved tag for unattended deploys
        # A tag push is unattended, so it may only install the one tag the
        # operator has explicitly pinned. Any other tag fails closed rather than
        # deploying whatever was just pushed. A manual dispatch is already a
        # deliberate human action, so it is not gated this way.
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPROVED_TAG: ${{ vars.SWARTZIT_DEPLOY_TAG }}
        run: |
          set -euo pipefail
          if [ -z "$APPROVED_TAG" ]; then
            echo 'No approved deployment tag is pinned. Set the SWARTZIT_DEPLOY_TAG' >&2
            echo 'repository variable to the tag that may deploy unattended.' >&2
            exit 1
          fi
          if [ "$TAG" != "$APPROVED_TAG" ]; then
            echo "Tag $TAG is not the approved deployment tag ($APPROVED_TAG)." >&2
            exit 1
          fi
          echo "Approved tag: $TAG"

      - name: Wait for the release assets to be published
        # release.yml runs concurrently with this workflow, so the assets may not
        # exist yet. Fail loudly rather than letting the updater report a
        # confusing "missing asset" error.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$repo/releases/tags/$TAG" \
              | grep -q '"name": *"swartzit-server-linux-amd64"'; then
              echo "Release $TAG is published."
              exit 0
            fi
            echo "Waiting for the $TAG release assets ($attempt/40)..."
            sleep 15
          done
          echo "Release $TAG was not published within 10 minutes." >&2
          exit 1

      - name: Install the release on this host
        # The deploy account may run exactly this one script as root. The script
        # is the copy installed under /var/lib/swartzit, not the one in this
        # checkout, so the code being deployed cannot rewrite its own installer.
        id: install-release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sudo -n /var/lib/swartzit/scripts/swartzit-linux-update.sh --tag "$TAG" --yes

      - name: Update the production worker X API token
        # The stable updater path is already on the host's sudo allowlist. The
        # release step above installs the version that understands this
        # token-only mode, so the value can be sent on stdin without appearing
        # in an argument list or workflow log.
        if: ${{ success() && (steps.install-release.outcome == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-x-token')) }}
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$X_BEARER_TOKEN" ]]; then
            echo 'No production X_BEARER_TOKEN secret is configured; existing worker token is unchanged.'
            exit 0
          fi
          printf '%s' "$X_BEARER_TOKEN" \
            | sudo -n /var/lib/swartzit/scripts/swartzit-linux-update.sh --sync-x-token-stdin

      - name: Test X API access from SER8
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.operation == 'test-x-token' }}
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          configured = os.environ.get('X_BEARER_TOKEN', '')
          if not configured:
              print('No production X_BEARER_TOKEN secret is configured.')
              raise SystemExit(1)

          candidates = [('as-stored', configured)]
          decoded = urllib.parse.unquote(configured)
          if decoded != configured:
              candidates.append(('percent-decoded', decoded))

          for form, token in candidates:
              headers = {'Authorization': 'Bearer ' + token, 'User-Agent': 'Swartzit-SER8-X-token-check'}
              profile_url = 'https://api.x.com/2/users/by/username/DarioAmodei?user.fields=username'
              try:
                  with urllib.request.urlopen(urllib.request.Request(profile_url, headers=headers), timeout=20) as response:
                      profile = json.load(response).get('data', {})
              except urllib.error.HTTPError as error:
                  print(f'X profile lookup from SER8 ({form}) returned HTTP {error.code}.')
                  continue
              except Exception as error:
                  print(f'X profile lookup from SER8 failed ({type(error).__name__}).')
                  raise SystemExit(1)

              user_id = profile.get('id')
              if not user_id:
                  print('X profile lookup returned no user id.')
                  raise SystemExit(1)
              query = urllib.parse.urlencode({
                  'max_results': '100',
                  'tweet.fields': 'attachments',
                  'expansions': 'attachments.media_keys',
                  'media.fields': 'type,url,preview_image_url,variants',
              })
              timeline_url = f'https://api.x.com/2/users/{user_id}/tweets?{query}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(timeline_url, headers=headers), timeout=25) as response:
                      timeline = json.load(response)
              except urllib.error.HTTPError as error:
                  print(f'X timeline lookup from SER8 ({form}) returned HTTP {error.code}.')
                  raise SystemExit(1)
              except Exception as error:
                  print(f'X timeline lookup from SER8 failed ({type(error).__name__}).')
                  raise SystemExit(1)

              counts = {'photo': 0, 'video': 0, 'animated_gif': 0}
              for item in timeline.get('includes', {}).get('media', []):
                  if item.get('type') in counts:
                      counts[item['type']] += 1
              print(
                  f"SER8 X API check passed for @{profile.get('username', 'unknown')} ({form}): "
                  f"{len(timeline.get('data', []))} recent posts, {counts['photo']} photos, "
                  f"{counts['video']} videos, {counts['animated_gif']} animated GIFs."
              )
              raise SystemExit(0)

          print('No tested bearer-token form authenticated to the X API from SER8.')
          raise SystemExit(1)
          PY

      - name: Collect the deployment receipt
        if: always()
        run: |
          set -euo pipefail
          sudo -n /bin/cat /var/lib/swartzit/state/update-receipt.json \
            || echo 'No deployment receipt was available.'
