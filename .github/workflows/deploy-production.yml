name: Deploy production

on:
  # Tag-triggered rather than every push to main. Each production deploy is a
  # published, checksummed release artifact, so a merge to main cannot change a
  # live host by itself. This pairs with release.yml, which builds the assets
  # this workflow installs.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy, for example v0.1.41-20260926T00'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swartzit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Keep the workflow present and reviewable before the deploy is enabled.
    # Set the repository variable to true to opt the live host in.
    if: ${{ vars.SWARTZIT_DEPLOY_ENABLED == 'true' }}
    # This host is not reachable from a GitHub-hosted runner: the public address
    # is CGNAT and only 80/443 are forwarded, so an SSH-based deploy from GitHub
    # can never connect. The runner therefore lives on the host itself and the
    # deploy is a single local command with no keys, no known_hosts, and no
    # inbound port.
    runs-on: [self-hosted, swartzit, production]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          REQUESTED: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            v[0-9]*) ;;
            *)
              echo "Refusing to deploy unexpected tag: $REQUESTED" >&2
              exit 1
              ;;
          esac
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Require an approved tag for unattended deploys
        # A tag push is unattended, so it may only install the one tag the
        # operator has explicitly pinned. Any other tag fails closed rather than
        # deploying whatever was just pushed. A manual dispatch is already a
        # deliberate human action, so it is not gated this way.
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPROVED_TAG: ${{ vars.SWARTZIT_DEPLOY_TAG }}
        run: |
          set -euo pipefail
          if [ -z "$APPROVED_TAG" ]; then
            echo 'No approved deployment tag is pinned. Set the SWARTZIT_DEPLOY_TAG' >&2
            echo 'repository variable to the tag that may deploy unattended.' >&2
            exit 1
          fi
          if [ "$TAG" != "$APPROVED_TAG" ]; then
            echo "Tag $TAG is not the approved deployment tag ($APPROVED_TAG)." >&2
            exit 1
          fi
          echo "Approved tag: $TAG"

      - name: Wait for the release assets to be published
        # release.yml runs concurrently with this workflow, so the assets may not
        # exist yet. Fail loudly rather than letting the updater report a
        # confusing "missing asset" error.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$repo/releases/tags/$TAG" \
              | grep -q '"name": *"swartzit-server-linux-amd64"'; then
              echo "Release $TAG is published."
              exit 0
            fi
            echo "Waiting for the $TAG release assets ($attempt/40)..."
            sleep 15
          done
          echo "Release $TAG was not published within 10 minutes." >&2
          exit 1

      - name: Install the release on this host
        # The deploy account may run exactly this one script as root. The script
        # is the copy installed under /var/lib/swartzit, not the one in this
        # checkout, so the code being deployed cannot rewrite its own installer.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sudo -n /var/lib/swartzit/scripts/swartzit-linux-update.sh --tag "$TAG" --yes

      - name: Collect the deployment receipt
        if: always()
        run: |
          set -euo pipefail
          sudo -n /bin/cat /var/lib/swartzit/state/update-receipt.json \
            || echo 'No deployment receipt was available.'
