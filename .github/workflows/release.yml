name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:${{ runner.temp }}/swartzit-release.sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      # The same gates CI runs, so a release tag can never publish an asset that
      # CI would have rejected.
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace
      - name: Web checks
        run: |
          npm ci
          npm run check
          npm test
          # Keep the web version badge aligned with this release tag.
          SWARTZIT_WEB_VERSION="${GITHUB_REF_NAME#v}" npm run build
          node ../../scripts/web-runtime-smoke.mjs
        working-directory: apps/web
      - name: Node and shell checks
        run: |
          npm ci
          node --check scripts/perf-smoke.mjs
          node --test scripts/*.test.mjs apps/web/src/lib/*.test.mjs
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Build release assets
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/swartzit-server dist/swartzit-server-linux-amd64
          tar -C apps/web -czf dist/swartzit-web-linux-amd64.tar.gz build
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/VERSION
          # A rehearsal of the production updater: checksum, list, and unpack the
          # exact assets that will be published.
          (cd dist && sha256sum swartzit-server-linux-amd64 swartzit-web-linux-amd64.tar.gz VERSION > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          test -x dist/swartzit-server-linux-amd64
          # adapter-node emits an SSR build, so the entry point is build/index.js
          # rather than an index.html.
          tar -tzf dist/swartzit-web-linux-amd64.tar.gz | grep -qx 'build/index.js'
          tar -tzf dist/swartzit-web-linux-amd64.tar.gz | grep -qx 'build/handler.js'
          tar -tzf dist/swartzit-web-linux-amd64.tar.gz | grep -q '^build/client/'

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Swartzit ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/swartzit-server-linux-amd64
            dist/swartzit-web-linux-amd64.tar.gz
            dist/VERSION
            dist/SHA256SUMS
